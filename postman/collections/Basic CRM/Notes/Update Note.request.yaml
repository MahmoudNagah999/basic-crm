$kind: http-request
name: Update Note
method: PUT
url: '{{base_url}}/notes/:id'
order: 4000
pathVariables:
  - key: id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "note": "Follow up completed. Customer confirmed requirements.",
      "customer_id": 1
    }
