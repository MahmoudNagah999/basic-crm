$kind: http-request
name: Create Note
method: POST
url: '{{base_url}}/notes'
order: 2000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "note": "Follow up with customer about project requirements.",
      "customer_id": 1
    }
