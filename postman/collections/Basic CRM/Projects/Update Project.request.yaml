$kind: http-request
name: Update Project
method: PUT
url: '{{base_url}}/projects/:id'
order: 4000
pathVariables:
  - key: id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "project_name": "Website Redesign v2",
      "status": false,
      "customer_id": 1,
      "project_cost": "5999.99"
    }
